services:
  api:
    build:
      context: ./apps/api
    container_name: medical-presentation-studio-api
    environment:
      DATABASE_URL: sqlite:////app/data/medical_presentation.db
      UPLOAD_DIR: /app/data/uploads
      OUTPUT_DIR: /app/data/outputs
      MAX_UPLOAD_SIZE_MB: 50
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: medical-presentation-studio-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
