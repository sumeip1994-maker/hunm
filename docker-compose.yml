services:
  api:
    build:
      context: ./apps/api
    container_name: medical-presentation-studio-api
    environment:
      DATABASE_URL: sqlite:////app/data/medical_presentation.db
      UPLOAD_DIR: /app/data/uploads
      OUTPUT_DIR: /app/data/outputs
      LLM_CONFIG_PATH: /app/data/llm_config.json
      MAX_UPLOAD_SIZE_MB: 50
      CORS_ORIGINS: http://localhost:3000
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: medical-presentation-studio-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
